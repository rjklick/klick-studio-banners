<script>
  const Scroll = ({
    event = 'animationEnd webkitAnimationEnd mozAnimationEnd',
    on,
    slider = 8,
    color = 'rgba(148,142,190,1)',
    track = '#2D1C66',
    curve = '50px',
    arrow,
    delay,
    speed,
    stopOnMove = true,
    stopOnClick = false,
  }) => {
    let sBox = document.querySelector('.main')
    if (!sBox) return setTimeout(Scroll, 100, { event, on, slider, color, track, curve, arrow, delay, speed })

    const html = sBox.innerHTML
    sBox.innerHTML = ''
    const
      sBar = sBox.appendChild(document.createElement('b')),
      sTab = sBar.appendChild(document.createElement('b')),
      sEl = sBox.appendChild(document.createElement('article'))
    sEl.id = 'html'
    start(sEl.innerHTML = html)

    sBar.style.background = track
    sTab.style.background = color
    sBar.style.borderRadius = sTab.style.borderRadius = curve
    let sRatio = sBar.clientHeight / sEl.scrollHeight
    const
      ua = navigator.userAgent.toLowerCase(),
      // safari = ua.indexOf('safari') > -1 && ua.indexOf('chrome') < 0,
      interval = 1000 / (speed || 1)
    window.scroll = {
      draw: () => {
        let view = sEl.scrollHeight - sEl.offsetHeight
        if (scroll.end = scroll.end || (sEl.scrollTop >= view)) scroll.stop()

        let h = sEl.offsetHeight * sBar.clientHeight / sEl.scrollHeight
        const thumb = parseFloat(slider) * (typeof slider === 'string' && slider.endsWith('%') ? sBar.clientHeight / 100 : 1)
        h = Math.round(h < thumb && thumb < sBar.clientHeight ? thumb : h)
        sTab.style.height = `${h}px`
        sRatio = (sBar.clientHeight - h) / view
        sTab.style.top = `${Math.abs(sEl.scrollTop * sRatio) || 0}px`
        sBox.classList[sEl.scrollTop > 10 ? 'add' : 'remove']('away')
      },
      by: val => sEl.scrollTop += (val || 1),
      auto: e => {
        scroll.stop()
        setTimeout(() => {
          scroll.id = setInterval(scroll.by, interval)
          // if (safari) setTimeout(() => scroll.safariId = setInterval(scroll.by, interval), interval / 2)
        }, delay || 0)
      },
      stop: () => {
        clearInterval(scroll.id)
        clearInterval(scroll.safariId)
      }
    }
    scroll.draw()

    const when = (el, e, cb, one) => el && e.split(' ').forEach(e => el.addEventListener(e, cb, one && { once: true })) || el
    when(sBox, 'click', e => e.target.tagName !== 'a' && e.stopPropagation())
    when(sBox, event, scroll.draw)
    when(sEl, 'scroll', scroll.draw)
    when(sEl, `${stopOnClick ? 'click touchstart' : ''} ${stopOnMove ? 'touchmove' : ''} mousewheel DOMMouseScroll`, scroll.stop)
    when(sBar, 'mousedown', () => when(document, 'mouseup', scroll.stop))
    if (!event) scroll.auto()
    else when(document.querySelector(on) || sBox, event, scroll.auto , true)
    let el = null, elY = 0
    const at = e => document.all ? window.event.clientY : e.pageY
    when(sTab, 'mousedown', e => elY = at(e) - (el = e.target).offsetTop)
    when(document, 'mousemove', e => el !== null && (sEl.scrollTop = (at(e) - elY) / sRatio))
    when(document, 'mouseup', () => el = stopOnClick && scroll.stop() || null)
    if (arrow) {
      const dir = by => e => scroll.by(by)
      when(sBar.appendChild(document.createElement('i')), 'mousedown', dir(-25))
      .style.borderColor = `transparent transparent ${arrow}`
      when(sBar.appendChild(document.createElement('i')), 'mousedown', dir(25))
      .style.borderColor = `${arrow} transparent transparent`
    }
  }
</script>

      // arrow: '#0000ff', // scroll arrow

      .to('.f1_logo, .f1_text_1, .f1_img', { opacity: 0, duration: 0.5, delay: 5, ease: Power1.Out }, 'Scene1')
      .to('.f1_pattern_layer', { opacity: 0, x: -200, duration: 0.5, delay: 5, ease: Power1.Out }, 'Scene1')
      
      .add('Scene2', 'Scene1+=5.5')
      .fromTo('.f2_text_1', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, delay: 0.1, ease: Power1.Out }, 'Scene2')
      .fromTo('.f2_footnote', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, delay: 0.5, ease: Power1.Out }, 'Scene2')
      .fromTo('.f2_pattern_layer_main', { opacity: 0, x: 100 }, { opacity: 1, x: 0, duration: 0.5, delay: 1, ease: Power1.Out }, 'Scene2')

<script>
  document.getElementById('main_link').removeAttribute('onclick')

  document.getElementById('prescribing_information_isi').removeAttribute('onclick')

  function main_link (e) {

  }
  function full_prescribing_information_sticky (e) {
    Enabler.exit('full_prescribing_information_sticky', links.full_prescribing_information_sticky)
  }
  function prescribing_information_isi (e) {
    Enabler.exit('prescribing_information_isi', links.prescribing_information_isi)
  }
  function start() {
    document.getElementById('main_link').removeEventListener('click', main_link, false)
    document.getElementById('main_link').addEventListener('click', main_link, false)

    document.getElementById('full_prescribing_information_sticky').removeEventListener('click', full_prescribing_information_sticky, false)
    document.getElementById('full_prescribing_information_sticky').addEventListener('click', full_prescribing_information_sticky, false)

    document.getElementById('prescribing_information_isi').removeEventListener('click', prescribing_information_isi, false)
    document.getElementById('prescribing_information_isi').addEventListener('click', prescribing_information_isi, false)
  }
  function init() {
    Enabler.isVisible() ? start() : Enabler.addEventListener(studio.events.StudioEvent.VISIBLE, start)
  }
  function load() {
    Enabler.isInitialized() ? init() : Enabler.addEventListener(studio.events.StudioEvent.INIT, init)
    animate()
  }
</script>
